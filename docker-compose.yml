version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bolao_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bolao_copa
      MYSQL_USER: bolao
      MYSQL_PASSWORD: bolao2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bolao_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=bolao
      - DB_PASSWORD=bolao2026
      - DB_NAME=bolao_copa
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=copa2026
      - JWT_SECRET=bolao-copa-2026-super-secret-key-change-in-production
      - NEXT_PUBLIC_BASE_URL=http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
